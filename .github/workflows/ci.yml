name: CI

on:
  push:
    branches:
      - staging
      - "feature/**"
      - "codex/**"
  pull_request:
    branches:
      - staging
      - "feature/**"
      - "codex/**"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and changed-file Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Check Python dependency consistency
        run: python -m pip check
      - name: Run fast backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Lint and format changed Python files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          mapfile -t python_files < <(
            git diff --name-only --diff-filter=ACMRT "${base}...HEAD" -- 'backend/**/*.py' \
              | grep -E '^backend/(app|tests)/.*\.py$' || true
          )
          if (( ${#python_files[@]} == 0 )); then
            echo "No changed backend app or test Python files to lint."
            exit 0
          fi
          python -m ruff check --select E,F,I "${python_files[@]}"
          python -m ruff format --check "${python_files[@]}"

  postgres-integration:
    name: PostgreSQL integration and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: family_cash_flow_integration_test
          POSTGRES_USER: family_cash_flow
          POSTGRES_PASSWORD: family_cash_flow_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_cash_flow -d family_cash_flow_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://family_cash_flow:family_cash_flow_test_only@localhost:5432/family_cash_flow_integration_test
      POSTGRES_INTEGRATION_DATABASE_URL: postgresql+psycopg://family_cash_flow:family_cash_flow_test_only@localhost:5432/family_cash_flow_integration_test
      RUN_POSTGRES_INTEGRATION: "1"
      POSTGRES_INTEGRATION_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Check Python dependency consistency
        run: python -m pip check
      - name: Wait for PostgreSQL readiness
        env:
          PGPASSWORD: family_cash_flow_test_only
        run: |
          for attempt in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U family_cash_flow -d family_cash_flow_integration_test; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready." >&2
          exit 1
      - name: Verify a single Alembic head
        working-directory: backend
        run: |
          python -m alembic heads
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads(); print(f'Alembic heads: {heads}'); assert len(heads) == 1, 'Expected exactly one Alembic head'"
      - name: Upgrade the live PostgreSQL database
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Verify current migration
        working-directory: backend
        run: python -m alembic current
      - name: Exercise the latest migration downgrade and upgrade
        working-directory: backend
        run: |
          python -m alembic downgrade 202610050002
          python -m alembic upgrade head
          python -m alembic current
      - name: Run required PostgreSQL integration tests
        working-directory: backend
        run: python -m pytest -m postgres tests/postgres -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
